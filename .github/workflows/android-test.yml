name: Android-test (emulator)

on:
  workflow_dispatch:
  push:
    branches: [android]

jobs:
  emulator:
    name: APK starten in een Android-emulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Android/build.gradle

      - name: Pakketten + KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-dejavu-core
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Project klaarzetten en x86_64-APK bouwen
        shell: bash
        run: |
          bash tools/android_prepare.sh
          echo "NDK_VER=$(basename "$ANDROID_NDK_LATEST_HOME")" >> $GITHUB_ENV
          cd android-build
          export NDK_VER="$(basename "$ANDROID_NDK_LATEST_HOME")" SGB_VERSION="$(cat ../VERSION)" SGB_VC=1 SGB_ABIS=x86_64
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --no-daemon assembleRelease && break; echo "poging $i mislukt, opnieuw"; sleep 30; done
          cp app/build/outputs/apk/release/app-release.apk ../test.apk

      - name: Starten in de emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r test.apk
            adb logcat -c
            adb shell am start -n nl.yf.smallgiveawaybike1/.SGBActivity
            sleep 40
            mkdir -p out
            adb shell screencap -p /sdcard/s1.png && adb pull /sdcard/s1.png out/01_start.png
            adb shell wm size
            SZ=$(adb shell wm size | tail -1 | sed 's/.*: //' | tr -cd '0-9x'); W=${SZ%x*}; H=${SZ#*x}; if [ $W -lt $H ]; then T=$W; W=$H; H=$T; fi
            tap() { adb shell input swipe $(( W * $1 / 1000 )) $(( H * $2 / 1000 )) $(( W * $1 / 1000 )) $(( H * $2 / 1000 )) 150; }
            adb shell input touchscreen tap $(( W / 2 )) $(( H / 2 )); sleep 2
            adb shell input tap $(( W / 3 )) $(( H / 3 )); sleep 2
            adb shell dumpsys input | grep -iE "touch|FocusedWindow|Display" | head -20 || true
            tap 230 900; sleep 4
            adb shell screencap -p /sdcard/s2.png && adb pull /sdcard/s2.png out/02_play.png
            tap 500 400; sleep 4
            adb shell screencap -p /sdcard/s3.png && adb pull /sdcard/s3.png out/03_slot.png
            sleep 25
            adb shell screencap -p /sdcard/s4.png && adb pull /sdcard/s4.png out/04_game.png
            adb shell input keyevent 4; sleep 3
            adb shell screencap -p /sdcard/s5.png && adb pull /sdcard/s5.png out/05_back.png
            adb logcat -d > out/logcat.txt || true
            grep -E " SGB|SDL|AndroidRuntime|FATAL|DEBUG   :" out/logcat.txt | head -150 || true
            adb shell pidof nl.yf.smallgiveawaybike1 && echo "APP DRAAIT NOG" || echo "APP DRAAIT NIET MEER"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: out
