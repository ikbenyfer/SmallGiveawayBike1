name: Bouw Small Giveaway Bike 1

on:
  push:
  workflow_dispatch:

jobs:
  preview:
    name: Linux-test + voorbeeldbeelden (geen iPad!)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri mesa-utils fonts-dejavu-core python3-pil xvfb zlib1g-dev

      - name: Plaatjes en lettertype voor Linux
        run: python3 tools/linux_assets.py preview_assets

      - name: Compileren met strenge waarschuwingen + AddressSanitizer
        shell: bash
        run: |
          gcc -std=c99 -O1 -g -Wall -Wextra -Wno-unused-parameter -Wno-misleading-indentation \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            Game/*.c Render/*.c Tests/preview_linux.c -o preview -lEGL -lGLESv2 -lz -pthread -lm 2>&1 | tee compile.log
          test -x preview

      - name: Hele game + automatische test draaien
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p preview_out
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1024x768x24' ./preview | tee preview_out/run.log
          cat preview_out/autotest_report.txt

      - name: Zelfde test op een 16:9-scherm (1366x768)
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
          SGB_WIDE: '1'
          SGB_QUALITY: '2'
          SGB_OUT: preview_out/wide
        run: |
          mkdir -p preview_out/wide
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1366x768x24' ./preview > preview_out/wide/run.log 2>&1
          tail -5 preview_out/wide/run.log

      - name: PPM naar PNG
        run: |
          python3 - <<'EOF'
          import glob, os
          from PIL import Image
          for p in glob.glob("preview_out/*.ppm") + glob.glob("preview_out/wide/*.ppm"):
              Image.open(p).save(p[:-4] + ".png")
              os.remove(p)
          EOF
          ls -l preview_out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: |
            preview_out
            compile.log

  build:
    name: App bouwen (iOS 9, armv7)
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_NAME: iPhoneOS14.5
    steps:
      - uses: actions/checkout@v4
        with:
          path: project

      - name: Linux-pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git libtinfo6 file
          sudo apt-get install -y libxml2 || sudo apt-get install -y libxml2-16

      - name: Theos
        run: git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: iOS-toolchain
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            | tar -xJf - -C "$THEOS/toolchain/"
          ls "$THEOS/toolchain/linux/iphone/bin" | head

      - name: ldid
        run: |
          TC="$THEOS/toolchain/linux/iphone/bin"
          if command -v ldid >/dev/null 2>&1; then echo "ldid: $(command -v ldid)"
          elif [ -x "$TC/ldid" ]; then sudo ln -sf "$TC/ldid" /usr/local/bin/ldid
          else
            sudo curl -fsSL -o /usr/local/bin/ldid "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64"
            sudo chmod +x /usr/local/bin/ldid
          fi

      - name: SDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$THEOS/bin/install-sdk" "$SDK_NAME"
          rm -rf "$THEOS/sdks/$SDK_NAME.sdk/System/Library/PrivateFrameworks/WebKit.framework"

      - name: App bouwen
        working-directory: project
        run: |
          sed -i 's/\r$//' layout/DEBIAN/postinst
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1 messages=yes

      - name: Controleren (ARMv7 en iOS 9)
        working-directory: project
        run: |
          APP=".theos/_/Applications/SmallGiveawayBike1.app"
          BIN="$APP/SmallGiveawayBike1"
          TC="$THEOS/toolchain/linux/iphone/bin"
          INFO="$(file "$BIN")"
          if [ -x "$TC/lipo" ]; then INFO="$INFO / $("$TC/lipo" -info "$BIN")"; fi
          echo "Architectuur: $INFO"
          echo "$INFO" | grep -qiE "armv7|arm_v7" || { echo "::error::geen armv7"; exit 1; }
          if [ -x "$TC/otool" ]; then
            "$TC/otool" -l "$BIN" | grep -A4 -E "LC_VERSION_MIN_IPHONEOS|LC_BUILD_VERSION" || true
            "$TC/otool" -L "$BIN" || true
          fi
          ls -l "$APP"
          du -sh "$APP"

      - name: IPA maken
        working-directory: project
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R ".theos/_/Applications/SmallGiveawayBike1.app" ipa/Payload/
          (cd ipa && zip -qr ../packages/SmallGiveawayBike1.ipa Payload)
          ls -l packages

      - uses: actions/upload-artifact@v4
        with:
          name: SmallGiveawayBike1
          path: |
            project/packages/*.ipa
            project/packages/*.deb

  windows:
    name: Windows-versie (x64, SDL2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: MinGW en hulpmiddelen
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libz-mingw-w64-dev python3-pil fonts-dejavu-core zip

      - name: SDL2 en SDL2_mixer (MinGW-ontwikkelpakketten)
        run: |
          mkdir -p deps && cd deps
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz | tar xz
          curl -fsSL https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-devel-2.8.0-mingw.tar.gz | tar xz
          ls

      - name: Icoon (exe)
        run: |
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("Resources/Icon-152.png").convert("RGBA")
          im.save("Win/app.ico", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128)])
          PY
          echo '1 ICON "app.ico"' > Win/app.rc
          x86_64-w64-mingw32-windres Win/app.rc -O coff -o Win/app_res.o

      - name: Compileren
        shell: bash
        run: |
          SDL=deps/SDL2-2.30.9/x86_64-w64-mingw32
          MIX=deps/SDL2_mixer-2.8.0/x86_64-w64-mingw32
          x86_64-w64-mingw32-gcc -std=gnu99 -O2 -Wall -Wno-unused-parameter -Wno-misleading-indentation \
            -I$SDL/include -I$SDL/include/SDL2 -I$MIX/include -DNDEBUG \
            Game/*.c Render/*.c Win/main_win.c Win/glload.c Win/app_res.o \
            -o SmallGiveawayBike1.exe \
            -L$SDL/lib -L$MIX/lib -lmingw32 -lSDL2main -lSDL2 -lSDL2_mixer \
            -lopengl32 -lwinhttp -lpsapi -lshell32 -lws2_32 -liphlpapi -l:libz.a \
            -static-libgcc -Wl,-Bstatic -lpthread -Wl,-Bdynamic -mwindows 2>&1 | tee win_compile.log
          test -f SmallGiveawayBike1.exe
          x86_64-w64-mingw32-objdump -p SmallGiveawayBike1.exe | grep "DLL Name"

      - name: Pakket maken
        run: |
          P=SmallGiveawayBike1-Windows
          mkdir -p $P/data
          cp SmallGiveawayBike1.exe $P/
          cp deps/SDL2-2.30.9/x86_64-w64-mingw32/bin/SDL2.dll $P/
          cp deps/SDL2_mixer-2.8.0/x86_64-w64-mingw32/bin/SDL2_mixer.dll $P/
          python3 tools/linux_assets.py $P/data
          cp Resources/sfx_*.wav Resources/vo_*.mp3 Resources/music.mp3 Resources/nl_hb.pak Resources/nl_hb_map.txt $P/data/
          cat > $P/LEESMIJ.txt <<'TXT'
          Small Giveaway Bike 1 - Windows-versie
          =======================================
          Start SmallGiveawayBike1.exe (de map data en de twee .dll-bestanden moeten ernaast blijven staan).

          Besturing
            W A S D / pijltjes   lopen, of in een voertuig: W gas, S rem/achteruit, A/D sturen
            Muis                  rondkijken (in het spel wordt de muis gevangen; Esc geeft hem terug)
            Linkermuisknop        schieten (met een wapen)
            Spatie                springen
            Shift                 rennen (kost uithoudingsvermogen)
            E of F                in- en uitstappen
            Q                     ander wapen
            M of Tab              grote kaart (slepen = schuiven, scrollwiel = zoomen)
            Esc                   pauze / terug
            F11                   volledig scherm
            Menu's bedien je met de muis; postcodes typ je gewoon op het toetsenbord.
            Controller (Xbox/PlayStation/...): werkt direct. Knoppen en toetsen aanpassen: Settings > CONTROLS.

          Opslag en instellingen staan in %APPDATA%\SmallGiveawayBike1 (ook log.txt bij problemen).
          Kaartgegevens: 3D BAG (TU Delft / 3DGI), BAG en TOP10NL (Kadaster, PDOK) - CC BY 4.0.
          TXT
          sed -i 's/^          //' $P/LEESMIJ.txt
          zip -qr SmallGiveawayBike1-Windows.zip $P
          ls -l SmallGiveawayBike1-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SmallGiveawayBike1-Windows
          path: SmallGiveawayBike1-Windows.zip

  linux:
    name: Linux-versie (x64, SDL2)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libsdl2-dev libsdl2-mixer-dev libcurl4-openssl-dev zlib1g-dev libgl-dev python3-pil fonts-dejavu-core

      - name: Compileren
        shell: bash
        run: |
          gcc -std=gnu99 -O2 -Wall -Wno-unused-parameter -Wno-misleading-indentation -DSGB_LINUX_GL -DNDEBUG \
            $(sdl2-config --cflags) Game/*.c Render/*.c Win/main_win.c -o SmallGiveawayBike1 \
            -lSDL2 -lSDL2_mixer -lGL -lcurl -lz -pthread -lm 2>&1 | tee linux_compile.log
          test -x SmallGiveawayBike1
          ldd SmallGiveawayBike1 | grep -E "SDL|curl|libGL"

      - name: Pakket maken
        run: |
          P=SmallGiveawayBike1-Linux
          mkdir -p $P/data
          cp SmallGiveawayBike1 $P/
          python3 tools/linux_assets.py $P/data
          cp Resources/sfx_*.wav Resources/vo_*.mp3 Resources/music.mp3 Resources/nl_hb.pak Resources/nl_hb_map.txt $P/data/
          cat > $P/LEESMIJ.txt <<'TXT'
          Small Giveaway Bike 1 - Linux-versie (x64)
          ==========================================
          Eenmalig nodig (Ubuntu/Debian/Mint):
            sudo apt install libsdl2-2.0-0 libsdl2-mixer-2.0-0 libcurl4
          (Fedora: sudo dnf install SDL2 SDL2_mixer libcurl)

          Starten:  ./SmallGiveawayBike1   (de map data moet ernaast blijven staan)
          Je huis staat aan de oostrand van de stad (paars huisje op de kaart).

          Besturing
            W A S D / pijltjes   lopen, of in een voertuig: W gas, S rem/achteruit, A/D sturen
            Muis                  rondkijken (Esc geeft de muis terug)
            Linkermuisknop        schieten (met een wapen)
            Spatie                springen
            Shift                 rennen (kost uithoudingsvermogen)
            E of F                in- en uitstappen
            Q                     ander wapen
            M of Tab              grote kaart
            Esc                   pauze / terug
            F11                   volledig scherm

          Online spelen: hoofdmenu ONLINE (UDP-poort 27016; op hetzelfde netwerk ook 27017).
          Opslag, instellingen en log.txt: ~/.local/share/SmallGiveawayBike1
          Kaartgegevens: 3D BAG (TU Delft / 3DGI), BAG en TOP10NL (Kadaster, PDOK) - CC BY 4.0.
          TXT
          sed -i 's/^          //' $P/LEESMIJ.txt
          chmod +x $P/SmallGiveawayBike1
          tar czf SmallGiveawayBike1-Linux.tar.gz $P
          ls -l SmallGiveawayBike1-Linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: SmallGiveawayBike1-Linux
          path: SmallGiveawayBike1-Linux.tar.gz

  android:
    name: Android-versie (APK, SDL2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Android/build.gradle

      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-dejavu-core

      - name: SDL2 + SDL2_mixer ophalen en Android-project klaarzetten
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          bash tools/android_prepare.sh
          echo "NDK_VER=$(basename "$ANDROID_NDK_LATEST_HOME")" >> $GITHUB_ENV
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sgb.p12"
            echo "KS_FILE=$RUNNER_TEMP/sgb.p12" >> $GITHUB_ENV
          else
            echo "Geen ANDROID_KEYSTORE_B64-secret: APK wordt met een tijdelijke debug-sleutel ondertekend"
          fi

      - name: APK bouwen
        working-directory: android-build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          export SGB_VERSION="$(cat ../VERSION)" SGB_VC="${{ github.run_number }}"
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --no-daemon assembleRelease && break; echo "poging $i mislukt, opnieuw"; sleep 30; done
          cp app/build/outputs/apk/release/app-release.apk ../SmallGiveawayBike1-Android.apk
          ls -l ../SmallGiveawayBike1-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmallGiveawayBike1-Android
          path: SmallGiveawayBike1-Android.apk

  quest:
    name: Meta Quest-versie (VR-APK, OpenXR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Quest/build.gradle

      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-dejavu-core unzip

      - name: Quest-project klaarzetten (Gradle-skelet + OpenXR-loader)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          bash tools/quest_prepare.sh
          echo "NDK_VER=$(basename "$ANDROID_NDK_LATEST_HOME")" >> $GITHUB_ENV
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sgb.p12"
            echo "KS_FILE=$RUNNER_TEMP/sgb.p12" >> $GITHUB_ENV
          fi

      - name: Quest-APK bouwen
        working-directory: quest-build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          export SGB_VERSION="$(cat ../VERSION)" SGB_VC="${{ github.run_number }}"
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --no-daemon assembleRelease && break; echo "poging $i mislukt, opnieuw"; sleep 30; done
          cp app/build/outputs/apk/release/app-release.apk ../SmallGiveawayBike1-Quest.apk
          ls -l ../SmallGiveawayBike1-Quest.apk
          unzip -l ../SmallGiveawayBike1-Quest.apk | grep -E "lib/arm64-v8a/|classes.dex"

      - uses: actions/upload-artifact@v4
        with:
          name: SmallGiveawayBike1-Quest
          path: SmallGiveawayBike1-Quest.apk

  switch:
    name: Nintendo Switch-versie (homebrew .nro)
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Pakketten (portlibs en Python voor de plaatjes)
        run: |
          dkp-pacman -Syu --noconfirm --needed switch-sdl2 switch-sdl2_mixer switch-mesa switch-curl switch-zlib switch-pkg-config || true
          apt-get update && apt-get install -y python3 python3-pil fonts-dejavu-core make

      - name: romfs + icoon klaarzetten
        run: bash tools/switch_prepare.sh

      - name: Bouwen (.nro)
        run: |
          make -f Switch/Makefile -j4
          ls -l SmallGiveawayBike1.nro

      - uses: actions/upload-artifact@v4
        with:
          name: SmallGiveawayBike1-Switch
          path: SmallGiveawayBike1.nro

  release:
    name: GitHub-release (iPad + Windows + Linux + Android + Quest + Switch)
    needs: [preview, build, windows, linux, android, quest, switch]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Release maken
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ls -R art
          VER="$(cat VERSION 2>/dev/null || echo 1.2)"
          TAG="v$VER"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then TAG="v$VER-build.${{ github.run_number }}"; fi
          printf 'Automatische build van main (%s).\n\n%s\n\nBestanden:\n- iPad (iOS 9, armv7): SmallGiveawayBike1.ipa of de .deb\n- Windows (x64): SmallGiveawayBike1-Windows.zip\n- Linux (x64): SmallGiveawayBike1-Linux.tar.gz\n- Android (5.0+, telefoon/tablet): SmallGiveawayBike1-Android.apk\n- Meta Quest (VR, Quest 2/3/Pro): SmallGiveawayBike1-Quest.apk (sideloaden)\n- Nintendo Switch (homebrew): SmallGiveawayBike1.nro (in /switch/ op de SD-kaart)\n' "${GITHUB_SHA:0:7}" "$MSG" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Small Giveaway Bike 1 $TAG" --notes-file notes.md --latest \
            art/SmallGiveawayBike1/*.ipa art/SmallGiveawayBike1/*.deb \
            art/SmallGiveawayBike1-Windows/*.zip art/SmallGiveawayBike1-Linux/*.tar.gz art/SmallGiveawayBike1-Android/*.apk art/SmallGiveawayBike1-Quest/*.apk art/SmallGiveawayBike1-Switch/*.nro
